[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "transcriber"
version = "0.1.0"
description = "Local media audio segmentation middleware"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy==2.4.2",
  "PyICU==2.16.2",
  "pyannote-ncnn-plda==0.1.0",
]

[tool.uv]
override-dependencies = ["numpy==2.4.2"]

[tool.uv.sources]
pyannote-ncnn-plda = { git = "https://github.com/grikdotnet/pyannote-community1-plda-vbx.git", rev = "34c8982e243eda9e42834ed255067ab727410379" }

[project.scripts]
transcriber-diarize = "transcriber.controller.diarization_cli:main"
transcriber-prepare = "transcriber.controller.cli:main"
transcriber-asr = "transcriber.controller.asr_cli:main"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "ninja==1.13.2",
  "pytest==9.0.2",
  "ruff==0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.hatch.build.targets.wheel.force-include]
"src/transcriber/resources/asr_models/qwen3-asr-1.7b.json" = "transcriber/resources/asr_models/qwen3-asr-1.7b.json"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "real_diarization: requires both installed native diarization engines and GPU APIs",
  "real_vad: requires the local native FireRedVAD provider and supplied model assets",
  "real_asr: requires the local llama.cpp provider and supplied Qwen ASR model assets",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
